# Forza Motorsport 4 (USA, title 4D530910): XMediaFacade_default.xex (SHA-256 560bb53f...58e9), the
# module default.xex loads with XexLoadImage. XenonRecomp config: addresses and
# evidence only; no game bytes. Paths are relative to this file. Surveyed with
#   scripts/survey.sh --module xmediafacade
# Its unproven switch stays a
# named stop unless separately justified.
[main]
file_path = "../game/files/XMediaFacade_default.xex"
out_directory_path = "../game/modules/xmediafacade/ppc"

# Generated by survey/switch_tables.py (committed, addresses only); relative to this file.
