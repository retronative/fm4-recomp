# Forza Motorsport 4 (USA, title 4D530910, default.xex SHA-256 3618e85a...3e09): XenonRecomp config.
# Addresses and evidence only; no game bytes. Paths are relative to this file.
#
# Hand-written keys.
[main]
file_path = "../game/files/default.xex"
out_directory_path = "../ppc"

# Generated by survey/switch_tables.py (committed, addresses only); relative to this file.
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off: patch 0023 makes *_as_local FATAL while secondary entries exist, and
# survey/survey.py refuses any of these set to true.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Context routines: derived from this image by scripts/survey.sh (context_routines.json;
# reference/recompiler/unproven_switches.md) and cross-checked against two
# other FM4 ports of the same default.xex.
# setjmp: store shape (r1 + 18 of r14-r31 through r3). The analysed function starts at 0x82762EBC,
# a zero padding word after the previous blr; the routine starts at 0x82762EC0 (reached by calls).
setjmp_address = 0x82762EC0
# longjmp: load shape through r7; 6 direct calls, 2 branches, 1 data reference.
longjmp_address = 0x82762A90
# Residual stops (patch 0035): table dispatches with no proven bound,
# accepted as documented stops. Each compiles to PpcResidualStop(address, name, index, lr): the
# dispatch is not translated, no case is taken from its table and the index is not clamped; the
# runtime reports the stop and halts. The list must equal the unproven switch tables exactly
# (XenonRecomp and scripts/validate.py check it).
# 0x82ADA478 (function 0x82ADA340, HYPOTHESIS: a range-coder model's decode step): index = field +24
# of the model (r3), no compare in the function. A hand analysis (reference/recompiler/unproven_switch_c.md)
# argues +24 <= 11 from the frequency total (h0 <= 15161 after every rebuild), but rests on open
# assumptions: no other writer of the model fields outside the four routines (only 0x82AD8000..
# 0x82ADE000 scanned) and two unverified call-site indices (0x82AD8B10, 0x82ADC6BC). ReXGlue/ShiftGlue
# and fm4-static-recomp have no proof for it either (references.md). M2 risk: the stop fires on every
# execution of this dispatch, i.e. whenever this decoder runs (likely asset loading).
residual_stops = [
    { address = 0x82ADA478, name = "range_model_decode_steps" },
]

# Zero padding between functions: the gap sweep skips it instead of starting a function on it.
# Evidence (first diagnostic survey): the sweep started a function at the zero word
# 0x82762EBC, after the previous function's blr, which made setjmp (0x82762EC0) a secondary entry
# that patch 0024 cannot handle. Zero words
# inside an analysed function still stop translation (patch 0004).
invalid_instructions = [{ data = 0x00000000, size = 4 }]

# Runtime routines (patch 0024), a [main] key (recompiler_config.cpp reads main["runtime_routines"]).
# switch_fiber: store shape through r5 and load shape through r3 (no r1): a context switch; the
# target of SwitchToFiber's branch. The analysed function starts at 0x82C7A450, CreateFiber's 16-byte
# fiber-start trampoline (mr r3,r31; bl; li r3,14; bl); the switch itself starts at 0x82C7A460.
# restore_context: load shape through r4; 1 direct call; never returns.
runtime_routines = [
    { address = 0x82C7A460, name = "switch_fiber" },
    { address = 0x82C8F3AC, name = "restore_context", noreturn = true },
]

# Compiler register save/restore helpers: one byte-pattern hit each in FM4's decrypted image
# (tools/survey/xexsurvey, VERIFIED); equal to ForzaRecomp's config/fm4.toml.
restgprlr_14_address = 0x827604A0
savegprlr_14_address = 0x82760450
restfpr_14_address = 0x82760C6C
savefpr_14_address = 0x82760C20
restvmx_14_address = 0x8275F958
savevmx_14_address = 0x8275F6C0
restvmx_64_address = 0x8275F9EC
savevmx_64_address = 0x8275F754

