# Extended View (runtime/kernel/extended_view.h, runtime/game/extended_view.cpp): the main 3D view's aspect ratio.
# sub_822B6380 is the viewport aspect getter, 12 instructions: lwz r11,12(r3); lwz r10,8(r3); ... fcfid; frsp; fdivs f1,f13,f0; blr
# = width (+8) / height (+12) of the viewport in r3, as a single in f1. It has three direct callers and no data reference.
# sub_822CAB88 (the per-view setup; r3 = the view, its viewport at +8) calls it twice:
#   0x822CAC28 bl sub_822B6380, then lwz r11,60(r30); mtctr; bctrl: the result to the camera's vtable slot +60 (sub_828C9E08: stfs
#     f1,256(r3); stb 1,464(r3): the camera's aspect and its dirty flag). The projection builder sub_822A39F0 divides cot(fov/2) by
#     that field for [0][0] (0x822A3AE8 fdivs f0,f12,f13 with f13 = 256(r31)), and the camera's frustum (sub_822DFB88 ->
#     sub_822C1078: atan(tan(fov/2) x aspect)) reads the same field, so the projection and the culling change together.
#   0x822CAE88 bl sub_822B6380, then stfs f1,180(r1): into the view's record {matrix, fov, aspect, near, far} for sub_822A5870.
# The handler multiplies the result for those two callers and a 1280x720 viewport; the third caller (sub_825E0198, a 2D overlay)
# and every other viewport keep the game's answer. Mirrors (sub_828CE598: 384x128, aspect 4.5) and cube maps set constants and never
# call the getter. Static reading (research/m9/ultrawide/REPORT.md); OBSERVED in a run: research/m9/ultrawide/RESULTS.md.
# Another FM4 port describes the same mechanism for its revision (a hook on the viewport aspect getter used by the main view's
# setup); its addresses are for another build and are not used.
[[hook]]
name = "extended view: the main view's aspect"
kind = "delegate"
function = 0x822B6380
flag = "FM4_EXTENDED_VIEW_HOOK"
bytes = 48
sha256 = "e84752c6b4f6c724f1e4051ca8df257f25a89d4d8ffdd3e222cdffb0108bc74b"
handler = "ViewportAspect"

[[symbol]]
name = "kMainViewSetup"
address = 0x822CAB88
bytes = 900
sha256 = "3ad0ae836737734b2798c58a7350fb1d3765375ee76bcc62e27b95b77354f8f2"
[[value]]
name = "kAspectForCamera"
value = 164
[[value]]
name = "kAspectForRecord"
value = 772

# Extended View for a window narrower than 16:9: the main view's vertical field of view.
# sub_822EC938 is two instructions: lfs f1,256(r3); blr: the field of view (radians) of the view's source object. It has five
# direct callers; sub_822CAB88 calls it twice, each time just before the aspect getter above:
#   0x822CABF4 bl sub_822EC938, then fmuls f1,f1,f31 (x 57.2958, the float at 0x82000DE0) and the camera's vtable slot +48;
#   0x822CAE78 bl sub_822EC938, then fmuls f0,f1,f31; stfs f0,176(r1): the same value into the view's record.
# The projection builder stores cot(fov / 2) as [1][1] and cot(fov / 2) / aspect as [0][0], so tan(fov' / 2) = tan(fov / 2) x t with
# the aspect divided by t leaves [0][0] alone and widens only the vertical view.
[[hook]]
name = "extended view: the main view's field of view"
kind = "delegate"
function = 0x822EC938
flag = "FM4_EXTENDED_VIEW_HOOK"
bytes = 8
sha256 = "3cac332e7a439a77f956ad2c5c489c3035114b33273c316091c40a887754f228"
handler = "ViewFieldOfView"

[[value]]
name = "kFovForCamera"
value = 112
[[value]]
name = "kFovForRecord"
value = 756

# Keyboard prompts (runtime/game/prompt_text.cpp, kernel/keyboard_prompts.h; FM4 Recomp 0.3.1's "prompts follow the input device",
# fm4-engine 0.3.2 host/, BSD-3): while the keyboard was the device used last (input_live.h LastDevice), FM4's English strings that
# name pad buttons in prose name the bound keys instead ("Press A to start the game." -> "Press SPACE to start").
# sub_823A4780 (r3 = string table, r4 = 16-bit key) -> r3 = the UTF-16BE text: `mr r31,r3; mr r3,r4; cmplwi r31,0; beq; lwz r11,12(r31);
# ...; bl 0x823a4800 (the key's entry); lwz r10,2(r3); lwz r11,8(r31); rlwinm r10,r10,1,0,30; add r3,r10,r11` (pool + 2 x offset), or
# the fallback text at 0x82D970E4 (`lis r11,-32039; lwz r3,28900(r11)`). Every localized string's GetText reaches it: the vtable of the string-id object MakeLocString makes,
# 0x8200254C (stored by its constructor sub_822A0E00 at 0x822A0E10..28, called from MakeLocString sub_822B1AE8) has slot +20 =
# sub_82380978 (the only data word 0x82380978 in the image), which loads the table (*(*(0x82DC36D4) + (byte +4 + 24) * 4)) and the key
# (+8) and ends with `b 0x823a4780`: a tail call, translated as a plain call that leaves ctx.lr as its caller set it, so the lookup
# sees its GetText caller's return address. The reference hooks the same entry (midasm 0x823A4780, return_on_true; host/config/rexglue/
# analysis/main-xex.toml:229-236, guest-addresses.toml:13-14 kStringLookup). Here a delegate: the handler runs the original, then
# replaces r3 for the 24 prompt keys. Static reading (2026-11-25); behaviour UNRESOLVED until a run.
[[hook]]
name = "string lookup: keyboard prompts"
kind = "delegate"
function = 0x823A4780
flag = "FM4_KEYBOARD_PROMPTS"
bytes = 128
sha256 = "570467fcd22637766ffb7b2feeeab3aa66cd83427bef295591ef5f45b4bd5922"
handler = "PromptStringLookup"

# A scene text element's update: sub_8233FAE8 (r3 ?, r4 = the element, r5 = its layout record; `mr r22,r3; mr r30,r4; mr r31,r5`; no
# instruction up to 0x8233FE4C has r30 as its first operand, and its calls preserve it). Its text is a std::wstring at element + 132 (`addi r28,r30,132`): 16-byte inline buffer while
# the capacity (+20 of the string, element + 152) is below 8, else a pointer at +132; the length at +16 (element + 148) (the assign
# below: `lwz r11,20(r31); cmplwi r11,8; blt (inline)`, `stw r30,16(r31)`). It copies that text into the record (0x8233FB64..8C:
# `addi r28,r30,132; addi r20,r31,28; ... bl 0x822fa000`) and lays the text out again only while byte element + 281 is set (0x8233FE4C
# `lbz r11,281(r30); cmplwi r11,0; beq +624`, cleared at 0x823400BC `stb r19,281(r30)`). Every path from the entry reaches 0x8233FE4C
# (forward branches only, to 8233FE18 / 8233FE48, and one backward strlen loop 8233FB94..A0). The reference hooks 0x8233FE4C itself
# (midasm, host/config/rexglue/analysis/main-xex.toml:238-244; game_hooks.cpp:279-285 the offsets): our hooks are whole functions, so
# the handler runs at the entry, before the original (so before the copy at 0x8233FB8C; README "Entry instead of the mid-function hook").
[[hook]]
name = "text element update: keyboard prompts"
kind = "delegate"
function = 0x8233FAE8
flag = "FM4_KEYBOARD_PROMPTS"
bytes = 1648
sha256 = "8cd0acc95b17c12c5e01236214376748cd7a88cb1f3dbca58425759ff0b40ab8"
handler = "PromptTextElementUpdate"

