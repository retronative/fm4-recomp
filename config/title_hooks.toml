# The near road missing after a race start (seen in playtests of Bernese Alps Quick Race). When the camera's area changes, the game queues the
# old area's resources for release on the main thread (unload requests, a few per frame through the budgeted pump sub_822C6C18) and
# starts the new area's loads on its loader threads. OBSERVED (scripted offscreen runs, 2026-11-17): when the
# switch lands in the frame the race scene starts, the main thread then spends 400-800 ms in the first race frame, the loader's
# allocations fill the 119.5 MB track resource heap (the heap object at 0x82D9B8DC) before one texture is released, the heap returns
# null about 950 times (model buffers through sub_8286FBE0, textures through sub_82958D70, loader data), and the game drops that
# data without a retry: zero near-road draws from then on. Causality both ways (a diagnostic build): holding the main thread's
# pump 800 ms made 4 of 4 starts bad, letting it finish the queued releases made 10 of 10 good. In good starts this heap returns
# null 0 times. Other heaps return null routinely (thousands of times a run, with fallbacks) and are left alone.
# sub_82AA34D0(r3 = heap, r4 = size, r5 = alignment, r6 = tag) is the heap class's allocation entry (vtable 0x820036E4 slot +72):
# a small-block cache first (sub_82AA0AB8), then sub_82AA2FA8; it returns the block or 0 and changes nothing on 0. The hook retries
# a null from the track resource heap while requests are queued for other threads (runtime/game/release_wait.cpp).
[[hook]]
name = "resource heap: allocate"
kind = "delegate"
function = 0x82AA34D0
flag = "FM4_LOAD_WAITS_RELEASES"
bytes = 96
sha256 = "0fab4c12250149d033e8382084d81e75a80e5d3d606388c9cec603564ff9b163"
handler = "HeapAllocateWaitsForReleases"

# The request queues: sub_82A74870 (the pump for the calling thread) finds the thread id (sub_82335CE0: lwz r11,256(r13);
