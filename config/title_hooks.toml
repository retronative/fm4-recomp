# FM4 title hooks: overrides of translated functions, generated into the build by scripts/gen_runtime_tables.py (fm4_hooks.cpp).
# Addresses and evidence only, from FM4's own default.xex image (game/survey/image.bin); every entry gives the SHA-256 of the function's first
# bytes by SHA-256 (no game bytes are committed), which the generator compares with the image and refuses to build on any difference. Each hook is opt-in by its flag.
#
# The pre-race sequence with the voice-over is not
# skippable in retail FM4: the game reads the pad throughout (FM4_DIAG_INPUT: lr 822B5EC4, 60 Hz), nothing
# waits (FM4_DIAG_WAITS) and the race loads only after it. The skip is gated by FM4's developer setting
# "allowskipvoiceover" (string at 0x820119A0, bound to byte 0xCE0 of the settings object by the table at sub_82400E18 beside
# vipplayer, forcebigtrackinhomespace, enablestressliveryoption: developer switches, off in retail). Its two readers are overridden
# so they answer as if the switch were on, nothing else changes. Another FM4 port
# reports the same mechanism ("Force the allowskipvoiceover getter to report true ... does not make saving or loading movies
# skippable"); its address is for another build and is not used.

[[hook]]
name = "allowskipvoiceover getter"
function = 0x82514260
flag = "FM4_SKIPPABLE_VOICEOVER"
returns = 1
# mflr r12; stw r12,-8(r1); stwu r1,-96(r1); bl 0x8237D468 (the settings object); lbz r3,0xCE0(r3); addi r1,r1,96; lwz r12,-8(r1);
# mtlr r12; blr: returns the switch.
bytes = 36
sha256 = "6e77c856495e82c94b5447cdeb851f1fe91434e3005177f0975ef3f0c9e7a346"

[[hook]]
name = "voice-over not skippable"
function = 0x82514288
flag = "FM4_SKIPPABLE_VOICEOVER"
returns = 0
# ... lwz r11,332(r3); cmplwi cr6,r11,0; beq ->0; bl 0x8237D468; lbz r11,0xCE0(r3); cmplwi r11,0; li r11,1; beq ->1; li r11,0;
# clrlwi r3,r11,24 ...: (field +332 != 0) && switch == 0, so 0 whenever the switch is on.
bytes = 64
sha256 = "529762251d588497181dc5857dce5d7386703d628e3b0620869c8f3cec8b315a"

# The long video before the first race is IE_Welcome_Video.wmv (FM4_DIAG_WAITS disc
# opens: game:\media\ui\videos\ie_welcome_video.wmv at vblank 3003, after the A press that leaves the front end). It plays in the
# scene "1_C_INI_IE_LOADING" (CIELoading@ForzaUI: scene table sub_824E2790, constructor sub_8253D1C0, vtable 0x8203931C). Retail
# FM4 cannot skip it: that scene's per-frame input slot (+36) is a bare blr (0x826387C0) and its event slot does nothing; its only
# exit is its tick sub_82542F48, which moves on (screen transition 94) once sub_82640350 ("is the movie playing", the movie at
# this+352) answers 0 (static reading). The voice-over switch above is never read there
# (sub_82514288 is called once, at the press that opened the scene). This hook adds the skip: when CIELoading's tick
# asks (return address 0x82542F70) after a new A press, it stops the movie with sub_826403E8, the call FM4's own attract screen
# CAttract makes to stop its movie (ppc_recomp.34.cpp, `lwz r3,352(r31); bl 0x826403e8`), and answers "not playing", so the tick
# takes its normal end-of-video path. Other callers (CAttract, lr 0x824B1164) are unchanged.
[[hook]]
name = "welcome video: skip on A"
kind = "stop_on_press"
function = 0x82640350
flag = "FM4_SKIPPABLE_WELCOME_VIDEO"
# mflr; ...; lwz r4,132(r31); vtable call +200; bl 0x824a7eb0 (the query); ...; blr
bytes = 152
sha256 = "2442bfe1b41520e663f735b51d7c27ca83c063e6ce5a9bf8d3f1dc3654c525e5"
caller = 0x82542F70
stop = 0x826403E8
# the same prologue and lookup, then bl 0x824a8658 (the stop); blr
stop_bytes = 144
stop_sha256 = "9345906d6c6d8615cf33a673bd306f450f8f0cd1ff6704c314a151220734a108"

# The Pause menu's Keyboard Controls row (a visible Keyboard Controls item in FM4's in-game
# Pause menu). The single-player Pause menu is ForzaUI::CPauseMenu (RTTI .?AVCPauseMenu@ForzaUI@@ at 0x82D6BFB4, vtable 0x82040D94,
# constructor sub_8259A1A8, scene "925_PAUSE_MENU" through the scene table sub_824E2790). Its row builder sub_825A2FF0 (called once
# from vtable slot 5 sub_825A86A8) adds each row to COMPONENT_OPTION_LIST (this+356, bound by slot 3 sub_825ACCA8) with
# `lwz r11,112(list vtable); r4 = row id; r5 = &text; r6 = 1; bctrl`, the text from sub_822B1AE8 (table "PauseMenu") copied by
# sub_82971220. Row ids 0..8 (Resume, Tune Car, Restart, Photo, Audio, HUD, Head Tracking, Mulligan, Quit Race / End Challenge);
# the scene's list has 11 slots (SPLASH_MENU_BUTTON..11). Its listener sub_825BA888 (vtable slot 0), on event 2, reads the chosen
# row id through the list's vtable +132 (r4 = r6) and dispatches 0..8 (`cmplwi r3,8; bgt`); any other id only reaches the tail
# (HIDE_SCREEN_INFO once, the id stored at sub_82516590()+2172, where the builder restores the focus). The label is built as the game
# builds user strings: sub_82368BA0(out, UTF-16BE text, -1) = new(16) + CUserString (sub_822CC4B8, the text copied). The builder
# ends by refreshing the list (`lwz r11,356(r31); addi r3,r11,108; ... lwz r11,40(r11); bctrl` at 825A3564): a row added after it
# is not shown (run 2026-11-15: seven rows, no Keyboard Controls). So row 9 goes in when the builder asks sub_8259E780 whether
# Quit Race goes at the bottom (`mr r3,r31; bl 0x8259e780` at 825A348C, return address 825A3490, r3 = the CPauseMenu), before
# Quit Race and the refresh; sub_8259E780's other callers (825B1258, 825B9348, 825B9448) are unchanged. Choosing the row opens the
# in-game Keyboard Controls (kernel/controls_screen.h) and returns to the menu. Static reading (disassembly,
