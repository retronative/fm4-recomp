# The render scenario settings of the GRAPHICS menu (SCENERY SHADOWS, REFLECTION UPDATES, MIRROR, SOFT PARTICLES, CROWDS, BLOOM, LEVEL OF
# DETAIL; runtime/game/render_scenario.h and .cpp). The mechanism is FM4 Static Recomp 0.3.2's (BSD-3; host/src/game_hooks.cpp:354-503
# value tables, :633-698 ApplyRenderScenarioSettings; host/config/rexglue/guest-addresses.toml:22-26), which runs the identical default.xex
# (its fingerprints of 0x824360D8 and 0x82436078 in host/config/rexglue/releases/rev1.toml are the first 16 hex digits of our SHA-256 of
# the same bytes); every number below was re-read here from our image (game/survey/image.bin) and translation (ppc/).
# The render scenario manager (CDynamicRenderSettings) is held by the word at 0x82DC3750 (`lis rX,-32036; lwz r3,14160(rX)` before each
# accessor call, e.g. in the scenario push sub_82450DE0 below and before both calls of the CrowdLoad accessor in ppc_recomp.70; 0 in the
# image, set at renderer init). Each control's accessor (r3 = the manager, r4 = the scenario index from sub_82335E98) has one shape:
# `lwz r11,96(r3)` (100 for ids 32..63); `rlwinm. r11,r11,32-id,31,31` (`clrlwi. r11,r11,31` for id 32): the override bit; set ->
# `lis r11,-32042; addi r11,r11,-24592` (the offset table at 0x82D59FF0, initialized data: ids 0..35 -> 44, 52, 60, ...);
# `lwz r11,4*id(r11); add r11,r11,r3; lbz/lwz/lfs ...,64(r11)`: the override value at manager + 64 + offset[id]; clear -> the stack of
# scenario files (file + 36: their mask; file + offset + 4: their value), then the defaults at manager + 456 + offset. No function that
# uses the offset table or the manager pointer stores to the mask words (static search of ppc/: the only stw ...,96/100 there are stack
# stores), so the override layer is ours; the plan still keeps every bit it does not own. Static reading (2026-11-25): VERIFIED for the
# ids, offsets, widths and the mask. The control names are the reference's and agree with the image (OBSERVED: the RTTI
# CDynamicRenderControlBool<0x21> etc. and the value widths of ids 25..35 follow the names' order in .rdata: CrowdDrawShadows 25 bool,
# CrowdSpriteDistScale 26 float, ParticleRateScale 28 float, EnvMapFrequencyScale 29 float, MaxCarsInMirror 30 int, HalfRateMirror 31,
# HalfRateBloom 32, SoftParticles 33 (the template's 0x21), SkipShadowMapUnlessCockpit 34 bool, ExposureShiftScale 35 float). What each
# setting looks like on screen is the reference's description: HYPOTHESIS here until a run.
#
# The tick: the main loop sub_822F7A00 runs `bl 0x822dc8e8; li r4,5; bl 0x822a23e8` at the head of every iteration (loop head loc_822F7B88,
# its back edge `b 0x822f7b88` near the end), a few instructions before the reference's Fm4MainLoopSession point (0x822F7C30, the same
# straight path). sub_822A23E8 has that one caller (return address 0x822F7BB4 = kMainLoop + 436). By its instructions: r4 & 15 < 6
# indexes a table of six 556-byte entries at 0x82D9B7C0 (`lis r10,-32038; addi r10,r10,-18496; mulli r11,r11,556`); when the entry's
# bytes 552 and 553 are set it calls sub_82AA0FF0 with the entry and, on 0, clears byte 553 and calls sub_82A9FE68 (r3, r4). What it
# is: HYPOTHESIS, heap upkeep (0x82D9B7C0 + 284 is the track resource heap kResourceHeap above; both callees sit beside that heap
# class's functions). The hook does not depend on it: it writes the override layer before the call, then makes the call unchanged.
[[hook]]
name = "render scenario: the main loop's tick"
kind = "delegate"
function = 0x822A23E8
flag = "FM4_RENDER_SCENARIO"
# mflr; bl 0x8276048c; stwu r1,-112(r1); mr r29,r3; mr r30,r4; clrlwi. r11,r4,28; ... mulli r11,r11,556; ... bl 0x82aa0ff0; ... bl 0x82a9fe68
bytes = 128
sha256 = "3eff5e8db751810c37db616164a12e6bc14463fd32f79d6764095efd0b148f81"
handler = "RenderScenarioTick"

