# Extended View (runtime/kernel/extended_view.h, runtime/game/extended_view.cpp): the main 3D view's aspect ratio.
# sub_822B6380 is the viewport aspect getter, 12 instructions: lwz r11,12(r3); lwz r10,8(r3); ... fcfid; frsp; fdivs f1,f13,f0; blr
# = width (+8) / height (+12) of the viewport in r3, as a single in f1. It has three direct callers and no data reference.
# sub_822CAB88 (the per-view setup; r3 = the view, its viewport at +8) calls it twice:
#   0x822CAC28 bl sub_822B6380, then lwz r11,60(r30); mtctr; bctrl: the result to the camera's vtable slot +60 (sub_828C9E08: stfs
#     f1,256(r3); stb 1,464(r3): the camera's aspect and its dirty flag). The projection builder sub_822A39F0 divides cot(fov/2) by
#     that field for [0][0] (0x822A3AE8 fdivs f0,f12,f13 with f13 = 256(r31)), and the camera's frustum (sub_822DFB88 ->
#     sub_822C1078: atan(tan(fov/2) x aspect)) reads the same field, so the projection and the culling change together.
#   0x822CAE88 bl sub_822B6380, then stfs f1,180(r1): into the view's record {matrix, fov, aspect, near, far} for sub_822A5870.
# The handler multiplies the result for those two callers and a 1280x720 viewport; the third caller (sub_825E0198, a 2D overlay)
# and every other viewport keep the game's answer. Mirrors (sub_828CE598: 384x128, aspect 4.5) and cube maps set constants and never
# call the getter. Static reading (research/m9/ultrawide/REPORT.md); OBSERVED in a run: research/m9/ultrawide/RESULTS.md.
# Another FM4 port describes the same mechanism for its revision (a hook on the viewport aspect getter used by the main view's
# setup); its addresses are for another build and are not used.
[[hook]]
name = "extended view: the main view's aspect"
kind = "delegate"
function = 0x822B6380
flag = "FM4_EXTENDED_VIEW_HOOK"
bytes = 48
sha256 = "e84752c6b4f6c724f1e4051ca8df257f25a89d4d8ffdd3e222cdffb0108bc74b"
handler = "ViewportAspect"

[[symbol]]
name = "kMainViewSetup"
address = 0x822CAB88
bytes = 900
sha256 = "3ad0ae836737734b2798c58a7350fb1d3765375ee76bcc62e27b95b77354f8f2"
[[value]]
name = "kAspectForCamera"
value = 164
[[value]]
name = "kAspectForRecord"
value = 772

# Extended View for a window narrower than 16:9: the main view's vertical field of view.
# sub_822EC938 is two instructions: lfs f1,256(r3); blr: the field of view (radians) of the view's source object. It has five
# direct callers; sub_822CAB88 calls it twice, each time just before the aspect getter above:
#   0x822CABF4 bl sub_822EC938, then fmuls f1,f1,f31 (x 57.2958, the float at 0x82000DE0) and the camera's vtable slot +48;
#   0x822CAE78 bl sub_822EC938, then fmuls f0,f1,f31; stfs f0,176(r1): the same value into the view's record.
# The projection builder stores cot(fov / 2) as [1][1] and cot(fov / 2) / aspect as [0][0], so tan(fov' / 2) = tan(fov / 2) x t with
# the aspect divided by t leaves [0][0] alone and widens only the vertical view.
[[hook]]
name = "extended view: the main view's field of view"
kind = "delegate"
function = 0x822EC938
flag = "FM4_EXTENDED_VIEW_HOOK"
bytes = 8
sha256 = "3cac332e7a439a77f956ad2c5c489c3035114b33273c316091c40a887754f228"
handler = "ViewFieldOfView"

[[value]]
name = "kFovForCamera"
value = 112
[[value]]
name = "kFovForRecord"
value = 756
