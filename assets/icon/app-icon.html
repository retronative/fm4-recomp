<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     FM4 Recomp app icon, 1024 x 1024 px (macOS icon grid: an 824 px rounded body at 100 px, corner radius 185).
     Rendered by assets/dmg/render.mjs into the .icns of FM4 Recomp.app. No bottom kerb strip: the dark body runs to the edge. The mark is the project logo (assets/fm4-recomp-logo.svg). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .body {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px; overflow: hidden;
    background: radial-gradient(ellipse 85% 75% at 50% 22%, #2b3039 0%, #16191e 62%, #0d0f12 100%);
    box-shadow: 0 18px 36px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 40% at 50% 60%, rgba(255,68,41,0.20), transparent 70%); }
  .logo { position: absolute; left: 50%; top: 330px; width: 700px; transform: translate(-50%, -50%);
          filter: drop-shadow(0 12px 22px rgba(0,0,0,0.55)); }
</style>
</head>
<body>
  <div class="body"><div class="glow"></div></div>
  <img class="logo" src="../fm4-recomp-logo.svg" alt="" style="top: 512px">
</body>
</html>
