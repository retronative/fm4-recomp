<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     The DMG's Finder volume icon, 1024 x 1024 px: a drive-shaped enclosure (an external drive seen
     from the front, aluminium with a dark face) with the FM4 Recomp app icon inset on its face. Rendered by
     assets/dmg/render.mjs into VolumeIcon.icns; the inset is the rendered app icon (?icon=<file URL>). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .drive {
    position: absolute; left: 92px; top: 250px; width: 840px; height: 560px; border-radius: 64px;
    background: linear-gradient(180deg, #e9ecf0 0%, #c9ced6 46%, #a9b0ba 100%);
    box-shadow: 0 30px 50px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.9), inset 0 -4px 0 rgba(0,0,0,0.18);
  }
  .face {
    position: absolute; left: 34px; top: 34px; right: 34px; bottom: 96px; border-radius: 40px;
    background: radial-gradient(ellipse 90% 80% at 50% 10%, #2a2f37 0%, #15181d 60%, #0c0e11 100%);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.6);
    overflow: hidden;
  }
  .kerb { position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
          background: repeating-linear-gradient(90deg, #ff4429 0 40px, #f2f2f2 40px 80px); opacity: 0.9; }
  .inset { position: absolute; left: 50%; top: 499px; width: 372px; height: 372px; transform: translate(-50%, -50%);
           filter: drop-shadow(0 10px 18px rgba(0,0,0,0.6)); }
  .base { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; }
  .led { position: absolute; right: 84px; bottom: 36px; width: 22px; height: 22px; border-radius: 50%;
         background: radial-gradient(circle at 40% 35%, #ffb3a6, #ff4429 55%, #a3200f);
         box-shadow: 0 0 14px rgba(255,68,41,0.9); }
  .vent { position: absolute; left: 84px; bottom: 40px; width: 260px; height: 14px; border-radius: 7px;
          background: repeating-linear-gradient(90deg, rgba(0,0,0,0.28) 0 10px, transparent 10px 20px); }
</style>
</head>
<body>
  <div class="drive">
    <div class="face"><div class="kerb"></div></div>
    <div class="base"><div class="vent"></div><div class="led"></div></div>
  </div>
  <img class="inset" alt="" id="inset">
  <script>document.getElementById('inset').src = new URLSearchParams(location.search).get('icon') || ''</script>
</body>
</html>
